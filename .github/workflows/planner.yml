# The daily planner, in the cloud (10-16 owner: "the complete cloud run"): growth brain (measure → read experts → think) and,
# when fewer than 6 reels are waiting, Claude writes the next 6 scripts and sets them up as a new batch on Drive. The factory
# workflow (every 3 h) then voices, edits, renders and books them. Weekly: prune old clip candidates on Drive (15 GB free plan).
name: planner

on:
  schedule:
    - cron: "0 0 * * *"    # 05:30 IST
    - cron: "0 12 * * *"   # 17:30 IST (10-26 owner: production must never stop — second chance every day)
  workflow_dispatch:

concurrency:
  group: factory          # never at the same time as a factory run (both write reels/ on Drive)
  cancel-in-progress: false

permissions:
  contents: write         # commits brain/ (growth notes, playbook, new script drafts) back to the repo
  actions: write          # starts a factory run right after a new batch is written

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
      - name: Pull from Drive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: bash tools/cloud/sync.sh pull
      - name: Growth brain (measure, read the expert sources, think)
        continue-on-error: true
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
          HQ_URL: ${{ secrets.HQ_URL }}
          HQ_KEY: ${{ secrets.HQ_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: timeout 3000 bash tools/growth_daily.sh
      - name: "Viral bank — collect new viral reels/shorts (10-27, the bank had stopped refilling; anonymous, stops cleanly on a rate limit)"
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          timeout 1500 python3 tools/viral_bank_yt.py --max-new 15 --transcribe || true
          timeout 1500 uv run -q --with curl_cffi python tools/viral_bank_ig.py --max-new 20 --transcribe || true
      - name: "Reels — trend-first, just in time (10-27), 3 fresh reels when under 1.5 days are booked or in production (tools/auto_planner.py)"
        continue-on-error: true
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
          HQ_URL: ${{ secrets.HQ_URL }}
          HQ_KEY: ${{ secrets.HQ_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: timeout 3000 python3 tools/auto_planner.py --min-days 1.5 --n 3
      - name: Carousels — keep 2 days (4) booked (tools/carousel_daily.py)
        continue-on-error: true
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: timeout 3000 python3 tools/carousel_daily.py --n 2 --min-booked 4
      - name: Weekly Drive clean-up (Sundays)
        if: always()
        continue-on-error: true
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: '[ "$(date +%u)" = 7 ] && APPLY=1 bash tools/cloud/sync.sh prune || true'
      - name: Push to Drive
        if: always()
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: bash tools/cloud/sync.sh push
      - name: Commit the brain (notes, playbook, plan, script drafts)
        if: always()
        run: |
          git config user.name "decodeher-planner"; git config user.email "planner@users.noreply.github.com"
          git add brain/ && git diff --cached --quiet || { git commit -q -m "Planner $(date +%F): growth notes, plan, scripts"; git push -q; }
      - name: Snapshot to HQ + start the factory on the new reels
        if: always()
        continue-on-error: true
        env:
          HQ_URL: ${{ secrets.HQ_URL }}
          HQ_KEY: ${{ secrets.HQ_KEY }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/cloud/report.py || true
          gh workflow run factory -f max_minutes=160 || true
