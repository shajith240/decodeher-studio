# The factory, in the cloud (brain/cloud-architecture.md): pull Drive → run every reel as far as it goes → push Drive → report to HQ.
# Nightly at 19:30 UTC (01:00 IST, after Claude's usage limit resets), on /make from Telegram (HQ dispatches "factory"), or by hand.
name: factory

on:
  schedule:
    - cron: "17 */3 * * *"   # 10-16: every 3 h (the gate step ends idle runs in seconds)
  repository_dispatch:
    types: [factory]
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Stop starting new jobs after this many minutes (running jobs always finish)"
        default: "160"

concurrency:
  group: factory
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # 10-27: self-repair starts the claude workflow

jobs:
  factory:
    runs-on: ubuntu-24.04
    # 300 min of work + a render/queue job that started just before the limit (≤ 25 min) + setup and sync; GitHub's cap is 360
    timeout-minutes: 355
    env:
      TZ: Asia/Kolkata
      MAX_MINUTES: ${{ github.event.inputs.max_minutes || github.event.client_payload.max_minutes || '160' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Anything to do? (asks HQ only — idle runs stop here)
        id: gate
        env:
          HQ_URL: ${{ secrets.HQ_URL }}
          HQ_KEY: ${{ secrets.HQ_KEY }}
          FORCE: ${{ github.event_name != 'schedule' }}
        run: |
          python3 tools/cloud/need_work.py | tee -a "$GITHUB_OUTPUT"
          if [ "$FORCE" = true ]; then echo "work=true" >> "$GITHUB_OUTPUT"; fi

      - uses: ./.github/actions/prepare
        if: steps.gate.outputs.work == 'true'

      - name: Pull from Drive
        id: pull
        if: steps.gate.outputs.work == 'true'
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: bash tools/cloud/sync.sh pull

      - name: Tell HQ the run started
        if: steps.gate.outputs.work == 'true'
        continue-on-error: true
        env:
          HQ_URL: ${{ secrets.HQ_URL }}
          HQ_KEY: ${{ secrets.HQ_KEY }}
        run: python3 tools/cloud/report.py event activity "Factory run started on GitHub"

      - name: Pinterest login (optional secret PINTEREST_COOKIES, a cookies.txt)
        if: steps.gate.outputs.work == 'true'
        env:
          PINTEREST_COOKIES: ${{ secrets.PINTEREST_COOKIES }}
        run: |
          if [ -n "$PINTEREST_COOKIES" ]; then
            ( umask 077; printf '%s\n' "$PINTEREST_COOKIES" > "$RUNNER_TEMP/pinterest-cookies.txt" )
            echo "PINTEREST_COOKIES_FILE=$RUNNER_TEMP/pinterest-cookies.txt" >> "$GITHUB_ENV"
          else
            echo "::warning::No PINTEREST_COOKIES secret: reels that need a clip search will fail at that step"
          fi

      - name: Run the factory
        id: run
        if: steps.gate.outputs.work == 'true'
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          [[ "$MAX_MINUTES" =~ ^[0-9]{1,3}$ ]] || MAX_MINUTES=160
          echo "BOOKED_BEFORE=$(grep -c '  Queued · ' logs/activity.log 2>/dev/null || true)" >> "$GITHUB_ENV"
          echo "PARKED_BEFORE=$(grep -c 'PARKED · ' logs/activity.log 2>/dev/null || true)" >> "$GITHUB_ENV"
          python3 tools/factory.py --once --max-minutes "$MAX_MINUTES"

      - name: Pinterest links from Telegram (tools/pin_intake.py)
        if: always() && steps.pull.outcome == 'success'
        continue-on-error: true
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          HQ_URL: ${{ secrets.HQ_URL }}
          HQ_KEY: ${{ secrets.HQ_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          ( umask 077; printf '%s\n' "$RCLONE_CONF" > "$RUNNER_TEMP/rclone.conf" ); export RCLONE_CONFIG="$RUNNER_TEMP/rclone.conf"
          timeout 1500 python3 tools/pin_intake.py

      - name: Self-repair (10-27) — a failed run or newly parked reels start Claude in the cloud, at most once every 6 h
        id: repair
        if: always() && steps.pull.outcome == 'success' && steps.gate.outputs.work == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
        run: |
          parked=$(grep -c 'PARKED · ' logs/activity.log 2>/dev/null || true); new=$(( ${parked:-0} - ${PARKED_BEFORE:-0} ))
          [ "$RUN_OUTCOME" = success ] && [ "$new" -le 0 ] && exit 0
          last=$(cat logs/repair-last 2>/dev/null || echo 0); now=$(date +%s)
          [ $(( now - last )) -ge 21600 ] || { echo "repair ran less than 6 h ago; skipping"; exit 0; }
          echo "$now" > logs/repair-last
          why="Factory run $GITHUB_RUN_ID: outcome $RUN_OUTCOME, $new reel(s) newly parked. Last lines: $(grep -h 'PARKED · \|failed\|Error' logs/activity.log | tail -6 | cut -c1-200 | tr '\n' ' ')"
          gh workflow run claude.yml -R "$GITHUB_REPOSITORY" -f kind=repair -f text="$why" && echo "repair started"

      - name: Push to Drive
        if: always() && steps.pull.outcome == 'success'
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: bash tools/cloud/sync.sh push

      - name: Report to HQ
        if: always() && steps.gate.outputs.work == 'true'
        continue-on-error: true
        env:
          HQ_URL: ${{ secrets.HQ_URL }}
          HQ_KEY: ${{ secrets.HQ_KEY }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
        run: |
          python3 tools/cloud/report.py || true
          last=$(grep -h "Factory run ends" logs/activity.log 2>/dev/null | tail -1 | cut -c11- || true)
          booked=$(grep -c "  Queued · " logs/activity.log 2>/dev/null || true)
          if [ "$RUN_OUTCOME" = success ] && [ "${booked:-0}" != "${BOOKED_BEFORE:-0}" ]; then
            python3 tools/cloud/report.py event "done" "${last:-Factory run finished} — new reels booked"
          elif [ "$RUN_OUTCOME" = success ]; then
            python3 tools/cloud/report.py event activity "${last:-Factory run finished}"
          else
            python3 tools/cloud/report.py event error "Factory run did not finish cleanly ($RUN_OUTCOME): $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      - name: Keep the reel logs
        if: always() && steps.gate.outputs.work == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: factory-logs-${{ github.run_id }}
          path: |
            logs/activity.log
            logs/factory.json
            logs/reels/
          retention-days: 7
          if-no-files-found: ignore
