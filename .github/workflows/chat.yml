# Always-on chat with Claude from Telegram (owner 10-27; tools/cloud/chat_runner.py). One run stays up ~5.5 h answering the
# owner's messages within seconds, then exits; the next run (started by it 15 min before, waiting in the "chat" group) takes
# over. The 20-minute schedule is the watchdog: it starts a runner if none is up, and is otherwise a no-op queued successor.
name: chat

on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"

# never two runners at once (they would both answer); a newer queued run replaces an older queued one, the running one is kept
concurrency:
  group: chat
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # the runner starts its successor (chat.yml), land.yml, and the factory/planner when Claude asks

jobs:
  chat:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      TZ: Asia/Kolkata
    steps:
      - name: Already up? (a scheduled watchdog run exits if a runner answered in the last 2 min)
        id: gate
        if: github.event_name == 'schedule'
        env:
          HQ_URL: ${{ secrets.HQ_URL }}
        run: |
          beat=$(curl -s -m 15 "$HQ_URL/api/state" | python3 -c "import json,sys; print(json.load(sys.stdin).get('chatBeatAge', 999999))" 2>/dev/null || echo 999999)
          if [ "${beat:-999999}" -lt 120 ]; then echo "runner up (${beat}s)"; echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          persist-credentials: false
          fetch-depth: 50

      - uses: ./.github/actions/prepare
        if: steps.gate.outputs.skip != 'true'

      - name: Pull the small files from Drive (videos follow in the background)
        id: pull
        if: steps.gate.outputs.skip != 'true'
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: LEAN=1 bash tools/cloud/sync.sh pull

      - name: Chat (tools/cloud/chat_runner.py)
        if: steps.gate.outputs.skip != 'true'
        env:
          HQ_URL: ${{ secrets.HQ_URL }}
          HQ_KEY: ${{ secrets.HQ_KEY }}
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        run: python3 tools/cloud/chat_runner.py
