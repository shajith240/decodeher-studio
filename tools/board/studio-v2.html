<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DecodeHer Studio</title>
<!-- The live studio (owner 10-15: "isometric pixel art, not cluttered, follow UI/UX principles, no latency").
     One stage (tools/board/art/plate.webp, generated) + one quiet rail. Live data arrives over /events (server push, ~80 ms);
     every overlay is placed in PLATE pixels (1536x1024) and the whole layer is scaled, so nothing drifts at any size. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#120d22; --rail:#17112b; --line:#2b2347; --ink:#efe9ff; --soft:#b9b0d9; --mute:#8a80ad;
  --lamp:#f5b041; --reel:#8b5cf6; --alarm:#ff5d73;
  --px:"Pixelify Sans",ui-monospace,monospace; --tx:"Atkinson Hyperlegible",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font:15px/1.45 var(--tx);display:grid;grid-template-rows:auto 1fr;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px;border-radius:4px}

/* top bar: name + the three facts the owner checks first */
header{display:flex;align-items:center;gap:32px;padding:14px 24px;border-bottom:1px solid var(--line)}
.brand{font:700 20px/1 var(--px);letter-spacing:.02em;display:flex;align-items:center;gap:12px;white-space:nowrap}
.live{font:400 13px var(--tx);color:var(--mute);display:flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.live.on i{background:var(--lamp);box-shadow:0 0 0 0 rgba(245,176,65,.6);animation:beat 2s infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(245,176,65,.55)}70%{box-shadow:0 0 0 8px rgba(245,176,65,0)}100%{box-shadow:0 0 0 0 rgba(245,176,65,0)}}
.facts{display:flex;gap:36px;margin-left:auto}
.fact b{display:block;font:700 18px/1.15 var(--tx)}
.fact span{font-size:13px;color:var(--mute)}
.fact.next b{color:var(--lamp)}

main{display:grid;grid-template-columns:minmax(0,1fr) 372px;min-height:0}

/* ── the stage ── */
.stage{position:relative;min-height:0;display:grid;place-items:center;overflow:hidden;background:#0d0919}
.frame{position:relative;aspect-ratio:3/2;width:min(100%, calc((100vh - 70px) * 1.5));}
.layer{position:absolute;left:0;top:0;width:1536px;height:1024px;transform-origin:0 0}
.plate{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;user-select:none}
svg.dim{position:absolute;inset:0;pointer-events:none}
svg.dim polygon{fill:#0a0618;opacity:.62;transition:opacity .7s ease}
svg.dim polygon.lit{opacity:0}
.screen{position:absolute;left:0;top:0;transform-origin:0 0;object-fit:cover;opacity:.9;filter:brightness(.82) saturate(.9);transition:opacity .5s;border-radius:2px}
.screen.off{opacity:0}

/* room name plates sit on the dark facade under each room, so they never cover the art */
.room{position:absolute;width:176px;padding:8px 12px 9px;border-radius:8px;background:rgba(18,13,34,.9);border:1px solid var(--line);
  text-align:left;transition:border-color .4s,background .4s;box-shadow:0 8px 20px rgba(0,0,0,.45)}
.room::before{content:"";position:absolute;left:50%;top:-9px;width:1px;height:9px;background:var(--line)}
.room.busy::before{background:rgba(245,176,65,.55)}
.frame.small .room{display:none}
.room .n{display:block;font:700 22px/1 var(--px);color:var(--soft)}
.room .s{display:block;font:400 14px/1.25 var(--tx);color:var(--mute);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room.busy{border-color:rgba(245,176,65,.55);background:rgba(36,24,20,.9)}
.room.busy .n{color:var(--lamp)}
.room.busy .s{color:var(--ink)}
.room.fix{border-color:var(--alarm)}
.room:hover,.room[aria-expanded=true]{border-color:var(--soft)}

.box{position:absolute;width:38px;height:37px;margin:-30px 0 0 -19px;background:url(/board/art/box.png) center/contain no-repeat;
  transition:left 1.4s cubic-bezier(.45,0,.2,1),top 1.4s cubic-bezier(.45,0,.2,1),opacity .4s;filter:drop-shadow(0 0 6px rgba(139,92,246,.75))}
.box.new{opacity:0}
.more{position:absolute;font:700 18px var(--px);color:var(--reel);text-shadow:0 0 6px #000}

.mgr{position:absolute;width:68px;height:120px;margin:-120px 0 0 -34px;background:url(/board/art/manager.png) 0 0/272px 120px no-repeat;
  image-rendering:auto;filter:drop-shadow(0 4px 3px rgba(0,0,0,.55));transition:opacity .35s}
.mgr.flip{transform:scaleX(-1)}
.mgr .tag{position:absolute;left:50%;bottom:128px;transform:translateX(-50%);white-space:nowrap;font:700 15px/1 var(--px);padding:5px 8px;border-radius:5px;
  background:var(--alarm);color:#1a0710}
.mgr.flip .tag{transform:translateX(-50%) scaleX(-1)}

/* room detail card (click a name plate) */
.pop{position:absolute;z-index:5;width:300px;padding:16px;border-radius:10px;background:var(--rail);border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.5)}
.pop[hidden]{display:none}
.pop .who{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.pop img{width:56px;height:56px;border-radius:8px;image-rendering:pixelated}
.pop h3{font:700 20px/1.1 var(--px)}
.pop p{color:var(--soft);font-size:14px}
.pop ul{list-style:none;padding:0;margin-top:10px;border-top:1px solid var(--line)}
.pop li{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}

/* ── the rail ── */
aside{background:var(--rail);border-left:1px solid var(--line);overflow-y:auto;padding:4px 24px 32px}
aside section{padding:20px 0;border-bottom:1px solid var(--line)}
aside section:last-child{border-bottom:0}
aside h2{font:700 17px/1 var(--px);color:var(--soft);margin-bottom:12px}
.face{width:40px;height:40px;border-radius:7px;image-rendering:pixelated;background:#1a1430;flex:none}
.boss{display:flex;gap:14px;align-items:flex-start}
.boss .face{width:64px;height:64px;border-radius:9px}
.boss .st{font:700 17px/1.2 var(--tx)}
.boss .st.ok{color:var(--ink)} .boss .st.fixing{color:var(--alarm)} .boss .st.watching{color:var(--lamp)} .boss .st.off{color:var(--mute)}
.boss p{color:var(--soft);font-size:14px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ask{margin-top:14px;padding:10px 12px;border-radius:8px;background:rgba(255,93,115,.12);border:1px solid rgba(255,93,115,.45)}
.ask b{color:var(--alarm);display:block;font-size:14px}
.ask span{font-size:14px}
.log{list-style:none;padding:0;margin-top:14px}
.log li{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:6px 0;font-size:14px;color:var(--soft)}
.log time{color:var(--mute);font-variant-numeric:tabular-nums}
.log .x{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.log li.fixed .x::first-line{color:var(--ink)}
.more-btn{font-size:14px;color:var(--mute);margin-top:6px;text-decoration:underline;text-underline-offset:3px}
.jobs{list-style:none;padding:0}
.jobs li{display:flex;gap:12px;align-items:center;padding:7px 0}
.jobs b{display:block;font-size:15px}
.jobs span{font-size:14px;color:var(--soft)}
.empty{color:var(--mute);font-size:14px}
.posts{list-style:none;padding:0}
.posts li{display:grid;grid-template-columns:128px 1fr;gap:10px;padding:6px 0;font-size:14px}
.posts time{white-space:nowrap}
.posts time{color:var(--lamp);font-variant-numeric:tabular-nums}
.posts li:not(:first-child) time{color:var(--soft)}
.feed{list-style:none;padding:0}
.feed li{display:grid;grid-template-columns:64px 1fr;gap:8px;padding:4px 0;font-size:14px;color:var(--soft)}
.feed li:first-child{color:var(--ink)}
.feed time{color:var(--mute);font-variant-numeric:tabular-nums}

@media (max-width:1100px){
  body{overflow:auto;display:block}
  header{flex-wrap:wrap;gap:12px 24px;padding:12px 16px}
  .facts{margin-left:0;gap:12px 24px;width:100%;display:grid;grid-template-columns:1fr 1fr}
  .fact.next{grid-column:1/-1}
  main{display:block}
  .frame{width:100%}
  aside{border-left:0;border-top:1px solid var(--line);padding:4px 16px 32px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">DecodeHer Studio <span class="live" id="live"><i></i><span>Connecting</span></span></div>
  <div class="facts">
    <div class="fact next"><b id="fNext">–</b><span id="fNextT">Next post</span></div>
    <div class="fact"><b id="fMade">–</b><span>Reels made this week</span></div>
    <div class="fact"><b id="fPosted">–</b><span>Posted</span></div>
  </div>
</header>
<main>
  <div class="stage" id="stage">
    <div class="frame" id="frame">
      <div class="layer" id="layer">
        <img class="plate" src="/board/art/plate.webp" alt="The studio: seven rooms in a production line, a conveyor of reels, and the manager's office upstairs" width="1536" height="1024">
        <img class="screen off" id="scrJudge" alt="">
        <img class="screen off" id="scrEdit" alt="">
        <svg class="dim" id="dim" viewBox="0 0 1536 1024" aria-hidden="true"><defs><filter id="soft"><feGaussianBlur stdDeviation="7"/></filter></defs><g filter="url(#soft)" id="dimG"></g></svg>
        <div id="boxes"></div>
        <div class="mgr" id="mgr" role="img" aria-label="The manager"><span class="tag" id="mgrTag" hidden>Fixing</span></div>
        <div id="rooms"></div>
        <div class="pop" id="pop" hidden role="dialog" aria-label="Room details"></div>
      </div>
    </div>
  </div>
  <aside>
    <section aria-labelledby="hMgr">
      <h2 id="hMgr">Manager</h2>
      <div class="boss"><img class="face" src="/board/art/faces/manager.png" alt=""><div><div class="st" id="mSt">Not on duty</div><p id="mTx"></p></div></div>
      <div id="mAsk"></div>
      <ol class="log" id="mLog"></ol>
      <button class="more-btn" id="mMore" hidden>Show earlier fixes</button>
    </section>
    <section aria-labelledby="hJobs"><h2 id="hJobs">Working now</h2><ul class="jobs" id="jobs"></ul></section>
    <section aria-labelledby="hPosts"><h2 id="hPosts">Next posts</h2><ol class="posts" id="posts"></ol></section>
    <section aria-labelledby="hFeed"><h2 id="hFeed">What just happened</h2><ol class="feed" id="feed"></ol></section>
  </aside>
</main>
<script>
"use strict";
// ── the plate's geometry (measured on art/plate.webp, 1536x1024). Rooms run left→right; walls at these x; the floor tilts 0.24 px per px.
const ROOMS = [
  {k:"voice",  name:"Voice",  role:"Records the narration",           x0:18,   x1:236,  belt:[[62,543],[206,604]]},
  {k:"scout",  name:"Scout",  role:"Finds clips for every line",      x0:236,  x1:422,  belt:[[256,575],[402,636]]},
  {k:"judge",  name:"Judge",  role:"Picks the best clip for each shot",x0:422, x1:627,  belt:[[452,628],[606,692]]},
  {k:"edit",   name:"Edit",   role:"Cuts the clips to the voice",     x0:627,  x1:832,  belt:[[656,682],[812,748]]},
  {k:"mix",    name:"Mix",    role:"Mixes voice, music and sound",    x0:832,  x1:1036, belt:[[858,738],[1008,800]]},
  {k:"render", name:"Render", role:"Builds the final video",          x0:1036, x1:1242, belt:[[1060,794],[1212,858]]},
  {k:"post",   name:"Post",   role:"Schedules it on Instagram",       x0:1242, x1:1480, belt:[[1262,850],[1388,904]]},
];
const TOP = (x) => 288 + .24 * x, FLOOR = (x) => 612 + .24 * x;           // back-wall top and front floor edge
const SCREENS = { judge: [[478,408],[622,424],[622,500],[478,486]], edit: [[680,468],[822,496],[822,586],[680,558]] };
const OFFICE = [560, 262], STAIR_TOP = [330, 200], STAIR_BOT = [196, 300], WALK = (x) => [x, 590 + .262 * x];   // manager path
const VERB = { voice:"Recording voice", scout:"Searching clips", judge:"Judging clips", edit:"Cutting clips", mix:"Mixing audio", render:"Rendering", post:"Queuing post" };
const $ = (id) => document.getElementById(id), esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const face = (k) => `/board/art/faces/${k}.png`;

// ── scale the plate layer to the frame (one transform; every overlay rides on it)
const layer = $("layer"), frame = $("frame");
new ResizeObserver(() => { layer.style.transform = `scale(${frame.clientWidth / 1536})`; frame.classList.toggle("small", frame.clientWidth < 760); }).observe(frame);

// ── static build: dim polygons + name plates
const dimG = $("dimG"), roomsEl = $("rooms");
for (const r of ROOMS) {
  const p = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
  p.setAttribute("points", [[r.x0, TOP(r.x0)], [r.x1, TOP(r.x1)], [r.x1, FLOOR(r.x1)], [r.x0, FLOOR(r.x0)]].map((q) => q.join(",")).join(" "));
  dimG.appendChild(p); r.dim = p;
  const b = document.createElement("button"); b.className = "room"; b.setAttribute("aria-expanded", "false");
  const cx = (r.x0 + r.x1) / 2; b.style.left = (cx - 88) + "px"; b.style.top = Math.min(FLOOR(cx) + 26, 1024 - 74) + "px";
  b.innerHTML = `<span class="n">${r.name}</span><span class="s">Idle</span>`;
  b.onclick = (e) => { e.stopPropagation(); openPop(r); };
  roomsEl.appendChild(b); r.el = b;
}
document.addEventListener("click", () => closePop()); document.addEventListener("keydown", (e) => e.key === "Escape" && closePop());

// ── live screens: a 4-corner homography so a real image sits on the drawn monitor
function quad(img, q, w, h) {
  const [[x0,y0],[x1,y1],[x2,y2],[x3,y3]] = q;
  const dx1 = x1-x2, dx2 = x3-x2, dy1 = y1-y2, dy2 = y3-y2, sx = x0-x1+x2-x3, sy = y0-y1+y2-y3, den = dx1*dy2 - dx2*dy1;
  const g = (sx*dy2 - dx2*sy) / den, hh = (dx1*sy - sx*dy1) / den;
  const a = x1-x0+g*x1, b = x3-x0+hh*x3, d = y1-y0+g*y1, e = y3-y0+hh*y3;
  img.style.width = w + "px"; img.style.height = h + "px";
  img.style.transform = `matrix3d(${a/w},${d/w},0,${g/w}, ${b/h},${e/h},0,${hh/h}, 0,0,1,0, ${x0},${y0},0,1)`;
}
quad($("scrJudge"), SCREENS.judge, 400, 240); quad($("scrEdit"), SCREENS.edit, 400, 240);

// ── state → scene
let S = null, popRoom = null;
const tidy = (t) => String(t || "").replace(/^\d+-(W2|Mon|Tue|Wed|Thu|Fri|Sat|Sun)-/i, "").replace(/\bdoesn t\b/i, "doesn't").replace(/-/g, " ").replace(/^\w/, (c) => c.toUpperCase());
function titleOf(q) { const r = (S.reels || []).find((r) => q.title.toLowerCase().includes(r.dir.split("-").slice(2).join("-").slice(0, 20))); return r ? r.title : tidy(q.title); }
function when(at) {   // "2026-10-15 08:30 IST" → "Today 08:30" / "Thu 08:30"
  const d = new Date(at.slice(0, 16).replace(" ", "T") + ":00+05:30"), now = new Date(), day = 864e5;
  const t = d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Kolkata" });
  const k = Math.floor((d - new Date(now.toDateString())) / day);
  return { d, label: (k === 0 ? "Today " : k === 1 ? "Tomorrow " : d.toLocaleDateString("en-GB", { weekday: "short", timeZone: "Asia/Kolkata" }) + " ") + t };
}
function untilText(d) { const m = Math.max(0, Math.round((d - Date.now()) / 6e4)); return m < 60 ? `in ${m} min` : `in ${Math.floor(m / 60)} h ${m % 60} min`; }

function render() {
  if (!S) return;
  const st = S.stations || {}, mgr = S.manager || {};
  // rooms: lit when working, dark when idle; the plate says what it is doing in plain words
  for (const r of ROOMS) {
    const s = st[r.k] || {}, busy = r.k === "post" ? (S.running || []).some((j) => /queu/i.test(j)) : !!s.busy;
    r.busy = busy; r.dim.classList.toggle("lit", busy || r.k === "post");
    r.el.classList.toggle("busy", busy); r.el.classList.toggle("fix", mgr.status === "fixing" && mgr.target === r.k);
    const job = (S.running || []).find((j) => j.toLowerCase().startsWith(VERB[r.k].split(" ")[0].toLowerCase().slice(0, 5)));
    r.el.querySelector(".s").textContent = busy ? (job ? job.split("·").slice(1).join("·").trim() || VERB[r.k] : VERB[r.k]) : r.k === "post" ? `${waitingPosts()} scheduled` : "Idle";
    r.el.setAttribute("aria-label", `${r.name}: ${r.el.querySelector(".s").textContent}`);
  }
  // live screens: the newest contact sheet on Judge's wall, the newest rendered frames on Edit's monitor
  setScreen($("scrJudge"), S.media?.sheet?.url, ROOMS[2].busy || ROOMS[1].busy);
  setScreen($("scrEdit"), S.media?.frames?.url, true);
  boxes(); facts(); rail();
  if (popRoom) openPop(popRoom, true);
  manager(mgr);
}
function setScreen(img, url, on) { if (url && img.dataset.u !== url) { img.dataset.u = url; img.src = url; } img.classList.toggle("off", !url || !on); }
const waitingPosts = () => (S.queue || []).filter((q) => q.status === "queued").length;

// reels as boxes on the belt of the room they are waiting for; a reel that moves on slides along the conveyor
const boxEls = new Map();
function boxes() {
  const host = $("boxes"), live = new Set(), perRoom = {};
  for (const r of S.reels || []) {
    if (r.posted || r.queued) continue;
    const k = ROOMS.some((x) => x.k === r.next) ? r.next : r.video === "done" ? "post" : null; if (!k) continue;
    (perRoom[k] = perRoom[k] || []).push(r);
  }
  host.querySelectorAll(".more").forEach((m) => m.remove());
  for (const room of ROOMS) {
    const list = perRoom[room.k] || [], [[ax, ay], [bx, by]] = room.belt, n = Math.min(list.length, 4);
    list.forEach((r, i) => {
      live.add(r.dir); let el = boxEls.get(r.dir);
      if (!el) { el = document.createElement("div"); el.className = "box new"; el.tabIndex = 0; host.appendChild(el); boxEls.set(r.dir, el); requestAnimationFrame(() => el.classList.remove("new")); }
      el.title = `${r.title} · waiting for ${room.name}`; el.setAttribute("aria-label", el.title);
      const t = n === 1 ? .5 : .12 + (.76 * Math.min(i, 3)) / (n - 1);
      el.style.left = (ax + (bx - ax) * t) + "px"; el.style.top = (ay + (by - ay) * t) + "px"; el.style.display = i < 4 ? "" : "none";
    });
    if (list.length > 4) { const m = document.createElement("div"); m.className = "more"; m.textContent = "+" + (list.length - 4); m.style.left = (bx + 6) + "px"; m.style.top = (by - 46) + "px"; host.appendChild(m); }
  }
  for (const [k, el] of boxEls) if (!live.has(k)) { el.style.opacity = 0; setTimeout(() => el.remove(), 450); boxEls.delete(k); }
}

function facts() {
  const reels = S.reels || [], made = reels.filter((r) => r.video === "done").length, q = (S.queue || []);
  const next = q.filter((x) => x.status === "queued").sort((a, b) => a.at.localeCompare(b.at))[0];
  $("fMade").textContent = `${made} of ${reels.length}`; $("fPosted").textContent = q.filter((x) => x.status === "posted").length;
  if (next) { const w = when(next.at); $("fNext").textContent = `${w.label.replace("Today ", "")} · ${untilText(w.d)}`; $("fNextT").textContent = `Next post: ${titleOf(next)}`; }
  else { $("fNext").textContent = "Nothing booked"; $("fNextT").textContent = "Next post"; }
}

let showAll = false;
function rail() {
  const m = S.manager || {}, st = { ok: "All clear", checking: "Checking the line", watching: "Keeping an eye on it", fixing: "Fixing a problem", off: "Not on duty" };
  const target = ROOMS.find((r) => r.k === m.target);
  $("mSt").className = "st " + (m.status === "checking" ? "ok" : m.status || "off");
  $("mSt").textContent = m.status === "fixing" && target ? `Fixing ${target.name}` : st[m.status] || st.off;
  $("mTx").textContent = m.status === "watching" ? "Just handled a problem and is making sure it stays fixed." : m.status === "ok" ? (m.queueUntil ? `The line is flowing. Posts are booked until ${m.queueUntil}.` : "The line is flowing.") : (m.text || "").replace(/^looking into:\s*/i, "Looking into: ");
  $("mAsk").innerHTML = (m.needsOwner || []).slice(0, 1).map((n) => `<div class="ask"><b>Needs you</b><span>${esc(n.text.replace(/^NEEDS OWNER:\s*/, ""))}</span></div>`).join("");
  const h = (m.history || []), shown = showAll ? h : h.slice(0, 3);
  $("mLog").innerHTML = shown.map((x) => `<li class="${/^FIXED/.test(x.text) ? "fixed" : ""}"><time>${esc(x.at)}</time><span class="x">${esc(x.text.replace(/^FIXED:\s*/, "Fixed: ").replace(/^looking into:\s*/i, "Looking into: "))}</span></li>`).join("");
  $("mMore").hidden = h.length <= 3; $("mMore").textContent = showAll ? "Show fewer" : "Show earlier fixes";
  // working now: one row per running job, with the face of the room doing it
  const jobs = (S.running || []).map((j) => { const r = ROOMS.find((r) => j.toLowerCase().startsWith(VERB[r.k].split(" ")[0].toLowerCase().slice(0, 5))) || ROOMS.find((r) => /contact|sheet/i.test(j) && r.k === "judge"); return { r, verb: j.split("·")[0].trim(), what: j.split("·").slice(1).join("·").trim() }; });
  $("jobs").innerHTML = jobs.length ? jobs.map((j) => `<li><img class="face" src="${face(j.r ? j.r.k : "manager")}" alt=""><div><b>${esc(j.verb.replace(/^\w/, (c) => c.toUpperCase()))}</b><span>${esc(j.what)}</span></div></li>`).join("")
    : `<li class="empty">Nothing is running. The next job starts as soon as a reel is ready for it.</li>`;
  const up = (S.queue || []).filter((q) => q.status === "queued").sort((a, b) => a.at.localeCompare(b.at));
  $("posts").innerHTML = up.length ? up.slice(0, 5).map((q) => `<li><time>${esc(when(q.at).label)}</time><span>${esc(titleOf(q))}</span></li>`).join("") + (up.length > 5 ? `<li><time></time><span class="empty">and ${up.length - 5} more booked</span></li>` : "")
    : `<li class="empty">No posts are booked. Finished reels are queued automatically.</li>`;
  $("feed").innerHTML = (S.activity || []).slice(0, 8).map((l) => `<li><time>${esc(l.slice(0, 5))}</time><span>${esc(l.slice(10).replace(/^Manager · /, "Manager: ").replace(/ · /g, ", "))}</span></li>`).join("");
}
$("mMore").onclick = () => { showAll = !showAll; rail(); };

function openPop(r, refresh) {
  const pop = $("pop"); if (!refresh) { ROOMS.forEach((x) => x.el.setAttribute("aria-expanded", "false")); r.el.setAttribute("aria-expanded", "true"); }
  popRoom = r; const s = (S && S.stations[r.k]) || {};
  const waiting = (S?.reels || []).filter((x) => !x.posted && !x.queued && x.next === r.k);
  pop.innerHTML = `<div class="who"><img src="${face(r.k)}" alt=""><div><h3>${r.name}</h3><p>${r.role}</p></div></div>
    <p>${r.busy ? "Working now: " : "Last job: "}${esc((s.text || "nothing yet").replace(/ · /g, ", "))}${s.at ? ` (${esc(s.at.slice(0, 5))})` : ""}</p>
    ${waiting.length ? `<ul>${waiting.map((x) => `<li>${esc(x.title)}</li>`).join("")}</ul>` : `<p style="margin-top:8px">No reels waiting here.</p>`}`;
  const x = Math.min(r.x0, 1536 - 316), y = FLOOR(r.x0) + 120; pop.style.left = x + "px"; pop.style.top = Math.min(y, 1024 - 260) + "px"; pop.hidden = false;
  pop.onclick = (e) => e.stopPropagation();
}
function closePop() { $("pop").hidden = true; popRoom = null; ROOMS.forEach((x) => x.el.setAttribute("aria-expanded", "false")); }

// ── the manager: stands in his office when all is clear; when fixing he walks down the stairs and along the floor to that room
const M = { el: $("mgr"), x: OFFICE[0], y: OFFICE[1], path: [], goal: "office", frame: 0, t: 0, hide: false };
const FR = { stand: 0, walkA: 1, walkB: 2, kneel: 3 };
function routeTo(k) {
  const down = [STAIR_TOP, STAIR_BOT, "jump", WALK(90)], up = [WALK(90), "jump", STAIR_BOT, STAIR_TOP, OFFICE];
  const onFloor = M.y > 330;
  if (k === "office") return onFloor ? [WALK(M.x)].concat(up) : [OFFICE];
  const r = ROOMS.find((x) => x.k === k); const spot = WALK((r.x0 + r.x1) / 2 + 30);
  return (onFloor ? [] : down).concat([spot]);
}
function manager(m) {
  M.el.hidden = m.status === "off" || !m.status;
  const goal = m.status === "fixing" ? (m.target || "voice") : "office";
  if (goal !== M.goal) { M.goal = goal; M.path = routeTo(goal); }
  $("mgrTag").hidden = !(m.status === "fixing" && !M.path.length);
}
let last = performance.now();
function step(now) {
  const dt = Math.min(1, (now - last) / 1000);   // big enough that a throttled / background tab still walks at the real pace last = now; M.t += dt;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (M.path.length) {
    const p = M.path[0];
    if (p === "jump") { M.path.shift(); const n = M.path[0]; M.el.style.opacity = 0; setTimeout(() => { M.x = n[0]; M.y = n[1]; M.el.style.opacity = 1; }, 350); M.wait = .4; }
    else if (M.wait > 0) M.wait -= dt;
    else {
      const dx = p[0] - M.x, dy = p[1] - M.y, d = Math.hypot(dx, dy), v = reduce ? 1e4 : 150 * dt;
      if (d <= v) { M.x = p[0]; M.y = p[1]; M.path.shift(); } else { M.x += dx / d * v; M.y += dy / d * v; }
      if (Math.abs(dx) > 1) M.el.classList.toggle("flip", dx > 0);
      M.frame = (Math.floor(M.t * 6) % 2) ? FR.walkA : FR.walkB;
    }
  } else M.frame = M.goal !== "office" ? FR.kneel : FR.stand;
  if (!M.path.length) $("mgrTag").hidden = !(S?.manager?.status === "fixing");
  M.el.style.left = M.x + "px"; M.el.style.top = M.y + "px"; M.el.style.backgroundPosition = `${-M.frame * 68}px 0`;
  requestAnimationFrame(step);
}
requestAnimationFrame(step);

// ── live data: server push; falls back to polling if the stream drops
const liveEl = $("live");
function setLive(on, txt) { liveEl.classList.toggle("on", on); liveEl.querySelector("span").textContent = txt; }
const demo = new URLSearchParams(location.search).get("demo");
function apply(d) {
  if (demo === "fix") d.manager = { ...d.manager, status: "fixing", target: "render", text: "Looking into: render failed 3 times for Just ask" };
  S = d; render();
}
let es, polling = null;
function connect() {
  es = new EventSource("/events");
  es.onmessage = (e) => { setLive(true, "Live"); if (polling) { clearInterval(polling); polling = null; } apply(JSON.parse(e.data)); };
  es.onerror = () => { setLive(false, "Reconnecting"); if (!polling) polling = setInterval(() => fetch("/state.json", { cache: "no-store" }).then((r) => r.json()).then(apply).catch(() => {}), 3000); };
}
connect();
setInterval(() => S && facts(), 30e3);   // keep "in 2 h 14 min" honest between pushes
</script>
